name: Release

# For now this runs only when someone starts it by hand (Actions, Release, Run workflow), and releases are made from a checkout
# with `pnpm version-packages` and `pnpm release` (see RELEASING.md). To have it run by itself again, add back
#
#   push:
#     branches: [main]
#
# under `on:`. Then Changesets collects the changes on main into a "Version packages" pull request, and merging that pull request
# publishes the packages to npm, with provenance, and creates the GitHub releases. Started by hand, it does the same for what is on main.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "Version packages"
          title: "Version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
